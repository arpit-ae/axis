name = "axis"
main = "src/index.js"
compatibility_date = "2026-10-19"

[vars]
CASHFREE_ENV = "production"
SITE_URL = "https://goaxis.in"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/pay-now", "/pay-now.html", "/api/*", "/src/*", "/migrations/*", "/README.md", "/PAYMENT_SETUP.md", "/wrangler.toml", "/.github/*", "/netlify/*", "/admin.html", "/admin.js", "/dashboard.html", "/login.html", "/signup.html"]

[[d1_databases]]
binding = "DB"
database_name = "goaxis-consultancy-db"
database_id = "93b4fc7e-d552-430a-b843-b846c6e28e51"
migrations_dir = "migrations"
