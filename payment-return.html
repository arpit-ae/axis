<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment return — GOAXIS CONSULTANCY</title><link rel="stylesheet" href="styles.css"><style>.return-card{max-width:680px;margin:4rem auto;padding:2rem;background:#fff;border:1px solid #e2e8f0;border-radius:16px}.return-card h1{margin-top:0}</style></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">G<span>.</span></span><span class="brand-copy"><strong>GOAXIS</strong><small>CONSULTANCY</small></span></a></div></header><main class="container"><section class="return-card"><p class="eyebrow">PAYMENT STATUS</p><h1>Checking your order</h1><p id="status" role="status">Checking the server for the latest payment status…</p><p class="muted">This page does not determine payment success. GOAXIS confirms payment only after the payment gateway's verified server notification.</p><a class="button" href="dashboard.html">Go to customer dashboard</a> <a class="button button-secondary" href="services.html">Browse services</a></section></main><script>
(async()=>{const out=document.getElementById("status"),id=new URLSearchParams(location.search).get("order_id");if(!id){out.textContent="No order ID was supplied. Please open your dashboard to check your orders.";return}try{const r=await fetch("/api/orders/"+encodeURIComponent(id),{credentials:"same-origin"}),d=await r.json();if(!r.ok)throw Error(d.error||"Could not retrieve order status.");out.textContent="Order "+d.order.id+" — current server status: "+d.order.status+". If payment was just completed, allow the verified gateway notification to update this status, then refresh your dashboard."}catch(e){out.textContent=e.message+" Sign in and check your dashboard."}})();
</script></body></html>
