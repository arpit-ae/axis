<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><title>Payment Status — GOAXIS CONSULTANCY</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script><script src="whatsapp.js" defer></script><style>.return-card{max-width:680px;margin:4rem auto;padding:2rem;background:#fff;border:1px solid #d9e2ec;border-radius:18px}.return-card h1{margin-top:0}.status-box{margin:1.25rem 0;padding:1rem;border-radius:12px;background:#f0f4f8}.success{color:#067647}.pending{color:#8a5a00}.failed{color:#b42318}</style></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">G<span>.</span></span><span class="brand-copy"><strong>GOAXIS</strong><small>CONSULTANCY</small></span></a><a class="button button-secondary" href="index.html">Home</a></div></header><main class="container"><section class="return-card"><p class="eyebrow">PAYMENT STATUS</p><h1 id="title">Checking your payment</h1><div id="status" class="status-box" role="status">Verifying the order with Cashfree…</div><div id="details"></div><div class="pay-actions"><a class="button" id="wa" href="#" target="_blank" rel="noopener" hidden>Confirm on WhatsApp ↗</a><a class="button button-secondary" href="pay-now.html">Make another payment</a></div><p class="muted">Payment status is confirmed from the server-side Cashfree order status, not from the browser redirect alone.</p></section></main><script>
(async()=>{const out=document.getElementById('status'),title=document.getElementById('title'),details=document.getElementById('details'),wa=document.getElementById('wa');const addDetail=(label,value)=>{const p=document.createElement('p'),strong=document.createElement('strong');strong.textContent=label+':';p.append(strong,document.createTextNode(' '+String(value)));details.appendChild(p)};const id=new URLSearchParams(location.search).get('order_id');if(!id){out.textContent='No order ID was supplied.';out.className='status-box failed';return}try{const r=await fetch('/api/cashfree/order/'+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw Error(d.error||'Could not verify the order.');const o=d.order||{};const paid=o.verified_status==='PAID'||o.order_status==='PAID';const status=o.verified_status||o.order_status||'UNKNOWN';if(paid){title.textContent='Payment successful ✓';out.textContent='Your payment has been verified successfully.';out.className='status-box success';const stored=JSON.parse(sessionStorage.getItem('goaxis_payment_customer')||'{}');addDetail('Order ID',o.order_id||id);const verifiedAmount=Number(o.order_amount||stored.amount||0);addDetail('Amount',Number.isFinite(verifiedAmount)?'₹'+verifiedAmount.toFixed(2):'Not available');addDetail('Status',status);const text='Hello GOAXIS, my payment was completed successfully. Order ID: '+(o.order_id||id)+'. Amount: ₹'+Number(o.order_amount||stored.amount||0).toFixed(2)+'. Purpose: '+(stored.purpose||'Online payment')+'.';wa.href='https://wa.me/919471990669?text='+encodeURIComponent(text);wa.hidden=false}else{title.textContent='Payment status: '+status;out.textContent=status==='ACTIVE'||status==='PENDING'?'Payment is still pending. Please wait a moment and refresh this page.':'Payment was not confirmed as successful.';out.className='status-box '+(status==='PENDING'||status==='ACTIVE'?'pending':'failed');addDetail('Order ID',o.order_id||id);}}catch(e){out.textContent=e.message||'Could not verify payment. Please try again.';out.className='status-box failed'}})();
</script></body></html>
