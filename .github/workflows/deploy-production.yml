name: Deploy GOAXIS to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - 'src/**'
      - 'cf-launch.js'
      - 'experience.js'
      - 'forms.js'
      - 'wrangler.toml'
      - '.github/workflows/deploy-production.yml'

permissions:
  contents: read

concurrency:
  group: goaxis-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax and payment-email tests
        run: |
          node --check src/index.js
          node --check src/email.js
          node --check cf-launch.js
          node --test tests/payment-emails.test.mjs tests/contact-enquiry.test.mjs tests/pay-now-navigation.test.mjs
      - name: Check deployment authorization
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::GitHub Actions secret CLOUDFLARE_API_TOKEN is missing. Add a restricted token with Workers Scripts Edit and rerun."
            exit 1
          fi
      - name: Deploy matched Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "348a6c87a3d63e65b44653d08839efa4"
        run: npx --yes wrangler@4 deploy --config wrangler.toml
      - name: Check deployed site pages (without charging)
        run: |
          for route in / /documents.html /faq.html /services.html /website-builder.html /business-suite-demo.html /pay-now.html; do
            curl --fail --show-error --silent --retry 3 --retry-delay 2 --output /dev/null "https://goaxis.in$route"
          done
          curl --fail --show-error --silent "https://goaxis.in/documents.html" | grep -q "Delivery Challan"
          curl --fail --show-error --silent "https://goaxis.in/website-builder.html" | grep -q "₹2,000"
          curl --fail --show-error --silent "https://goaxis.in/" | grep -q "bundle-banner"\n          curl --fail --show-error --silent "https://goaxis.in/" | grep -q "header-pay-now"\n          curl --fail --show-error --silent "https://goaxis.in/pay-now.html" | grep -q "id=\\"pay-button\\""
          curl --fail --show-error --silent "https://goaxis.in/business-suite-demo.html" | grep -q "document-editor"
