name: Phase 1 checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/phase1-working-forms]
jobs:
  syntax-and-wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check forms.js
          node --check part2.js
          node --check payment.js
          node --check experience.js
          node --check admin.js
          node --check src/index.js
          node --check src/email.js
          node --check cf-launch.js
      - name: Verify payment email logic with mocked Cashfree and Resend
        run: node --test tests/payment-emails.test.mjs tests/contact-enquiry.test.mjs
      - name: Guard Pay Now in site header and Cashfree checkout
        run: node --test tests/pay-now-navigation.test.mjs
      - name: Check Phase 1 wiring
        run: |
          grep -q 'src="forms.js" defer' index.html
          grep -q 'src="forms.js" defer' service.html
          grep -q 'id="enquiry-form"' index.html
          grep -q 'id="service-enquiry-form"' service.html
          grep -q 'POST /api/enquiry' README.md
          grep -q 'CREATE TABLE IF NOT EXISTS Leads' migrations/0001_phase1_enquiries.sql
          grep -q 'customer_details.customer_phone_invalid' src/index.js
          grep -q 'payment-return.html?order_id=' src/index.js
          grep -q 'service-price' service.html
          grep -q 'netlify/' .assetsignore
          if grep -qxF "payment-return.html" .assetsignore; then echo "payment return page must be uploaded as an asset"; exit 1; fi
          grep -q 'Cloudflare' PAYMENT_SETUP.md
          grep -q 'RESEND_API_KEY' EMAIL_SETUP.md
          grep -q 'CREATE TABLE IF NOT EXISTS PaymentNotifications' migrations/0002_payment_notifications.sql
          grep -q 'invoice-basic' src/index.js
          grep -q 'invoice-challan' documents.html
          grep -q 'website-ten-page' website-builder.html
          grep -q 'premium.css' index.html
          grep -q 'faq.html' sitemap.xml

      - name: Check complete suite and no WhatsApp in public pages
        run: |
          grep -q 'sales &amp; purchase invoice' website-builder.html || grep -q 'purchase &amp; sales invoices' website-builder.html
          grep -q 'business-suite-demo.html' index.html
          grep -q 'contact@goaxis.in' src/email.js
          grep -q 'email_sent' src/index.js
          grep -q 'Send' forms.js
          if grep -Eil 'whatsapp|wa\\.me|api\\.whatsapp\\.com' index.html services.html documents.html website-builder.html service.html faq.html pay-now.html payment-return.html privacy.html terms.html refunds-cancellations.html 404.html business-suite-demo.html app.js part2.js forms.js experience.js; then
            echo "Old WhatsApp contact references found in public website assets"; exit 1;
          fi
