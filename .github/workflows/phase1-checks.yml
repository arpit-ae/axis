name: Phase 1 checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/phase1-working-forms]
jobs:
  syntax-and-wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check forms.js
          node --check part2.js
          node --check src/index.js
          node --check src/auth.js
          node --check portal.js
      - name: Check Phase 1 wiring
        run: |
          grep -q 'src="forms.js" defer' index.html
          grep -q 'src="forms.js" defer' service.html
          grep -q 'id="enquiry-form"' index.html
          grep -q 'id="service-enquiry-form"' service.html
          grep -q 'POST /api/enquiry' README.md
          grep -q 'CREATE TABLE IF NOT EXISTS Leads' migrations/0001_phase1_enquiries.sql
