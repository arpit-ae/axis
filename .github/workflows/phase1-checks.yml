name: Phase 1 checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/phase1-working-forms]
jobs:
  syntax-and-wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check forms.js
          node --check part2.js
          node --check payment.js
          node --check whatsapp.js
          node --check admin.js
          node --check src/index.js
      - name: Check Phase 1 wiring
        run: |
          grep -q 'src="forms.js" defer' index.html
          grep -q 'src="forms.js" defer' service.html
          grep -q 'id="enquiry-form"' index.html
          grep -q 'id="service-enquiry-form"' service.html
          grep -q 'POST /api/enquiry' README.md
          grep -q 'CREATE TABLE IF NOT EXISTS Leads' migrations/0001_phase1_enquiries.sql
          grep -q 'customer_details.customer_phone_invalid' src/index.js
          grep -q 'payment-return.html?order_id=' src/index.js
          grep -q 'service-price' service.html
          grep -q 'netlify/' .assetsignore
          if grep -qxF "payment-return.html" .assetsignore; then echo "payment return page must be uploaded as an asset"; exit 1; fi
          grep -q 'Cloudflare' PAYMENT_SETUP.md
