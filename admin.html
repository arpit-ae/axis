<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#102a43"><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="portal.css"><title>Admin | GOAXIS CONSULTANCY</title><script src="portal.js" defer></script></head>
<body class="account-page portal-page" data-portal="admin"><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html" aria-label="GOAXIS Consultancy home"><span class="brand-mark">G<span>.</span></span><span class="brand-copy"><strong>GOAXIS</strong><small>CONSULTANCY</small></span></a><nav class="portal-nav"><a href="index.html">Home</a><a href="services.html">Services</a><a href="index.html#contact">Contact</a></nav></div></header>
<main class="container portal-shell" id="admin-login-wrap"><section class="portal-card">
<form id="admin-login-form" class="portal-form" novalidate>
<p class="eyebrow">ADMIN</p><h1>Admin login.</h1><p class="portal-sub">For the GOAXIS team only.</p>
<label>Admin email<input name="email" type="email" autocomplete="username" required maxlength="254"></label>
<label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label>
<button class="button portal-submit" type="submit">Log in →</button>
<p class="portal-msg" role="status" aria-live="polite"></p>
</form></section></main>

<main class="container portal-shell portal-wide" id="admin-panel" hidden><section class="portal-card">
<div class="portal-head"><div><p class="eyebrow">ADMIN DASHBOARD</p><h1>Enquiries &amp; customers</h1></div><button type="button" class="button button-secondary button-small" id="logout-btn">Log out</button></div>
<div class="portal-stats" id="lead-stats"></div>
<div class="portal-tabs"><button type="button" data-admin-tab="leads" class="active">Enquiries</button><button type="button" data-admin-tab="users">Customers</button></div>
<div data-admin-panel="leads">
<form id="lead-filter" class="portal-filter"><input name="q" type="search" placeholder="Search name, email, phone, reference"><select name="status"><option value="">All statuses</option></select><button class="button button-small" type="submit">Filter</button></form>
<div id="leads"><p class="portal-sub">Loading…</p></div>
</div>
<div data-admin-panel="users" hidden><div id="users"><p class="portal-sub">Loading…</p></div></div>
</section></main></body></html>
